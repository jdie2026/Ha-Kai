<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Há Kai</title>
    
    <!-- Enlace a tu hoja de estilos externa -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Fuentes de Google para el texto secundario (Playfair y Segoe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Componente para el modelo 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
</head>
<body>

    <header>
        <h1>Há Kai</h1>
    </header>

    <main class="container">
        <div class="text-section">
            <p>Una nueva perspectiva. Te invitamos a rotar y descubrir la armonía de nuestras formas desde cualquier ángulo.</p>
            <br>
            <!-- Este botón ahora te desplaza suavemente al formulario -->
            <a href="#contacto" class="btn">Contáctanos</a>
        </div>
        
        <div class="model-container">
            <!-- Asegúrate de poner el nombre exacto de tu archivo .glb aquí -->
            <model-viewer src="assets/models/molde3D.glb" alt="Diseño Há Kai" auto-rotate camera-controls></model-viewer>
        </div>
    </main>

    <!-- Sección de Contacto Minimalista -->
    <section id="contacto" class="contact-section">
        <h2>Inicia tu proyecto</h2>
        <form class="contact-form" action="#" method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo electrónico" required>
            <textarea name="mensaje" placeholder="¿En qué podemos ayudarte?" required></textarea>
            <button type="submit" class="btn-submit">Enviar mensaje</button>
        </form>
    </section>

</body>
</html>
